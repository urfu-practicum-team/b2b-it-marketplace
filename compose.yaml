name: b2b-it-marketplace
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-app.sh:/docker-entrypoint-initdb.d/10-init-app.sh:ro
    secrets:
      - postgres_password
      - marketplace_app_password
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/marketplace}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-marketplace_app}
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      MARKETPLACE_PORTFOLIO_DIRECTORY: /var/lib/marketplace/portfolio
    volumes:
      - ${MARKETPLACE_PORTFOLIO_DIR:-./data/portfolio}:/var/lib/marketplace/portfolio
    secrets:
      - source: marketplace_app_password
        target: spring.datasource.password
  web:
    build: ./frontend
    ports:
      - "${MARKETPLACE_PORT:-8081}:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres_data:
secrets:
  postgres_password:
    file: ${MARKETPLACE_SECRETS_DIR:-./secrets}/postgres_password
  marketplace_app_password:
    file: ${MARKETPLACE_SECRETS_DIR:-./secrets}/marketplace_app_password
