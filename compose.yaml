name: b2b-it-marketplace
services:
  backend:
    build: ./backend
    restart: unless-stopped
  web:
    image: nginx:stable-alpine
    volumes:
      - ${MARKETPLACE_STATIC_DIR:-./frontend/dist}:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${MARKETPLACE_PORT:-8081}:80"
    depends_on:
      - backend
    restart: unless-stopped
