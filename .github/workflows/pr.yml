name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Spring and generate JaCoCo report
        working-directory: backend
        run: |
          # JaCoCo needs an execution data file even when there are no tests.
          mkdir -p target
          touch target/jacoco.exec
          mvn -B -ntp verify
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        id: node
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        id: install
        working-directory: frontend
        run: npm ci
      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: frontend
        run: npm run lint
      - name: Vitest with coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: frontend
        run: npm test
      - name: Build with Vite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: frontend
        run: npm run build
      - name: Check combined line coverage
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/coverage_gate.py
